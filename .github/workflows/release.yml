name: release

# 这个 workflow 属于【公开发布仓 llmpro-release】。
# 它在构建时临时拉取【私有源码仓 llmpro】的代码（源码不会进入本仓库），
# 三平台编译签名安装包，上传到 Huawei Cloud OBS，并同步一个 GitHub
# bridge latest.json，兼容已经安装的旧版本。
#
# 手动发版：Actions -> release -> Run workflow，填写：
#   source_ref  = 私有源码仓要构建的分支或 tag（默认 main）
#   release_tag = 发布版本号，如 v0.2.0（需与源码里 tauri.conf.json 的 version 一致）
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的分支/tag'
        required: true
        default: 'main'
      release_tag:
        description: '发布版本 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: llmpro-release-publication
  cancel-in-progress: false

jobs:
  verify-obs-config:
    name: Verify OBS release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check OBS variables and secrets
        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            OBS_ACCESS_KEY \
            OBS_SECRET_KEY \
            OBS_BUCKET \
            OBS_ENDPOINT \
            OBS_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing OBS release setting::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  release:
    needs: verify-obs-config
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}

    steps:
      # 拉取私有源码（需要一个能读私有仓的 PAT，存为 secret: SOURCE_REPO_TOKEN）
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Install Linux system deps (WebKitGTK etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Install JS deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate source before packaging
        working-directory: source
        run: |
          pnpm typecheck
          pnpm test --run
          cargo test claude_desktop_config --manifest-path src-tauri/Cargo.toml

      # 从 release_tag 自动生成版本覆盖（无需改源码里的 tauri.conf.json）
      - name: Prepare version override from tag
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG || '';
          const version = tag.replace(/^v/, '');
          const base = (process.env.OBS_PUBLIC_BASE_URL || '').replace(/\/+$/, '');
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error(`invalid release tag: ${tag}`);
            process.exit(1);
          }
          if (!base) {
            console.error('OBS_PUBLIC_BASE_URL is required');
            process.exit(1);
          }
          const config = {
            version,
            plugins: {
              updater: {
                endpoints: [`${base}/llmpro/latest.json`],
              },
            },
          };
          fs.writeFileSync('version-override.json', `${JSON.stringify(config)}\n`);
          console.log(`version and updater endpoint override -> ${version}, ${base}/llmpro/latest.json`);
          NODE

      - name: Verify macOS signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing macOS signing secret::$name is required for signed distribution"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # tauri-action 在“本仓库”(公开仓)创建 Release，latest.json 里的下载地址即公开仓地址
      - name: Build & publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: source
          tagName: ${{ github.event.inputs.release_tag }}
          releaseName: 'llmpro ${{ github.event.inputs.release_tag }}'
          releaseBody: '应用内会自动检测并提示更新。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config ${{ github.workspace }}/source/version-override.json

  publish-obs:
    name: Publish OBS artifacts and bridge manifest
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download all generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --dir .release-assets

      - name: Prepare OBS manifest and upload directory
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_ASSET_DIR: .release-assets
          OBS_UPLOAD_DIR: .obs-upload
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          STABLE_MANIFEST_PATH: updater/latest.json
        run: node scripts/publish-obs-manifest.mjs

      - name: Install obsutil
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obsutil"
          curl -fsSL \
            'https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz' \
            | tar -xz -C "$RUNNER_TEMP/obsutil"
          OBSUTIL="$(find "$RUNNER_TEMP/obsutil" -type f -name obsutil | head -1)"
          if [ -z "$OBSUTIL" ]; then
            echo "::error::obsutil binary was not found"
            exit 1
          fi
          chmod 755 "$OBSUTIL"
          echo "OBSUTIL=$OBSUTIL" >> "$GITHUB_ENV"

      - name: Upload versioned assets to OBS
        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          config_dir="$RUNNER_TEMP/obs-config"
          mkdir -p "$config_dir"
          cd "$config_dir"
          "$OBSUTIL" config \
            -i="$OBS_ACCESS_KEY" \
            -k="$OBS_SECRET_KEY" \
            -e="$OBS_ENDPOINT"

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/$name" \
              "obs://$OBS_BUCKET/llmpro/$version/$name" \
              -f \
              -acl=public-read
          done < <(find "$GITHUB_WORKSPACE/.obs-upload" -maxdepth 1 -type f -print0)

          "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/latest.json" \
            "obs://$OBS_BUCKET/llmpro/latest.json" \
            -f \
            -acl=public-read \
            -meta=Content-Type:application/json

      - name: Replace GitHub bridge manifest with OBS URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            .obs-upload/latest.json \
            --clobber

      - name: Commit bridge manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- updater/latest.json; then
            echo "Bridge manifest is already newer or identical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "chore(updater): bridge ${{ github.event.inputs.release_tag }} to OBS"
          git push
