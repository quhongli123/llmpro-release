name: release

# 这个 workflow 属于【公开发布仓 llmpro-release】。
# 它在构建时临时拉取【私有源码仓 llmpro】的代码（源码不会进入本仓库），
# 三平台编译签名安装包 + latest.json，发布到本仓库的 Releases。
# 应用内自动更新读取的就是本仓库 releases/latest 的 latest.json。
#
# 手动发版：Actions -> release -> Run workflow，填写：
#   source_ref  = 私有源码仓要构建的分支或 tag（默认 main）
#   release_tag = 发布版本号，如 v0.2.0（需与源码里 tauri.conf.json 的 version 一致）
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的分支/tag'
        required: true
        default: 'main'
      release_tag:
        description: '发布版本 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}

    steps:
      # 拉取私有源码（需要一个能读私有仓的 PAT，存为 secret: SOURCE_REPO_TOKEN）
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Install Linux system deps (WebKitGTK etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Install JS deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      # 从 release_tag 自动生成版本覆盖（无需改源码里的 tauri.conf.json）
      - name: Prepare version override from tag
        working-directory: source
        run: |
          VER="${{ github.event.inputs.release_tag }}"
          VER="${VER#v}"
          printf '{"version":"%s"}\n' "$VER" > version-override.json
          echo "version override -> $VER"
          cat version-override.json

      # tauri-action 在“本仓库”(公开仓)创建 Release，latest.json 里的下载地址即公开仓地址
      - name: Build & publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: source
          tagName: ${{ github.event.inputs.release_tag }}
          releaseName: 'llmpro ${{ github.event.inputs.release_tag }}'
          releaseBody: '应用内会自动检测并提示更新。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config ${{ github.workspace }}/source/version-override.json
