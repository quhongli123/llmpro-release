name: release

# 这个 workflow 属于【公开发布仓 llmpro-release】。
# 它在构建时临时拉取【私有源码仓 llmpro】的代码（源码不会进入本仓库），
# 三平台编译签名安装包 + latest.json，发布到本仓库的 Releases。
# 所有构建完成后，将最高语义版本的 latest.json 发布到 updater/latest.json。
# 应用内自动更新只读取该固定地址，避免 GitHub releases/latest 按发布时间倒退。
#
# 手动发版：Actions -> release -> Run workflow，填写：
#   source_ref  = 私有源码仓要构建的分支或 tag（默认 main）
#   release_tag = 发布版本号，如 v0.2.0（需与源码里 tauri.conf.json 的 version 一致）
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的分支/tag'
        required: true
        default: 'main'
      release_tag:
        description: '发布版本 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: llmpro-release-publication
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}

    steps:
      # 拉取私有源码（需要一个能读私有仓的 PAT，存为 secret: SOURCE_REPO_TOKEN）
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Install Linux system deps (WebKitGTK etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Install JS deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      # 从 release_tag 自动生成版本覆盖（无需改源码里的 tauri.conf.json）
      - name: Prepare version override from tag
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          node -e 'const fs=require("node:fs"); const tag=process.env.RELEASE_TAG || ""; const version=tag.replace(/^v/, ""); if (!/^\d+\.\d+\.\d+$/.test(version)) { console.error(`invalid release tag: ${tag}`); process.exit(1); } fs.writeFileSync("version-override.json", JSON.stringify({version}) + "\n"); console.log("version override -> " + version); console.log(fs.readFileSync("version-override.json", "utf8"));'

      - name: Verify macOS signing and notarization secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing macOS release secret::$name is required for signed and notarized distribution"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # tauri-action 在“本仓库”(公开仓)创建 Release，latest.json 里的下载地址即公开仓地址
      - name: Build & publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: source
          tagName: ${{ github.event.inputs.release_tag }}
          releaseName: 'llmpro ${{ github.event.inputs.release_tag }}'
          releaseBody: '应用内会自动检测并提示更新。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config ${{ github.workspace }}/source/version-override.json

  publish-updater-manifest:
    name: Publish stable updater manifest
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download generated release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .updater-download
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir .updater-download

      - name: Keep the highest semantic-version manifest
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const releaseTag = process.env.RELEASE_TAG ?? "";
          const version = releaseTag.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Invalid release tag: ${releaseTag}`);
          }

          const source = ".updater-download/latest.json";
          const target = "updater/latest.json";
          const next = JSON.parse(fs.readFileSync(source, "utf8"));
          if (next.version !== version) {
            throw new Error(`Manifest version ${next.version} does not match ${version}`);
          }

          for (const platform of ["darwin-aarch64", "windows-x86_64", "linux-x86_64"]) {
            if (!next.platforms?.[platform]?.url || !next.platforms?.[platform]?.signature) {
              throw new Error(`Generated manifest is missing ${platform}`);
            }
          }

          const compare = (left, right) => {
            const a = left.split(".").map(Number);
            const b = right.split(".").map(Number);
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          };

          if (fs.existsSync(target)) {
            const current = JSON.parse(fs.readFileSync(target, "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(current.version ?? "")) {
              throw new Error(`Invalid existing manifest version: ${current.version}`);
            }
            if (compare(version, current.version) < 0) {
              console.log(`Keep current manifest ${current.version}; ${version} is older.`);
              process.exit(0);
            }
          }

          fs.mkdirSync("updater", { recursive: true });
          fs.writeFileSync(target, `${JSON.stringify(next, null, 2)}\n`);
          console.log(`Published stable updater manifest ${version}.`);
          NODE

      - name: Commit stable updater manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- updater/latest.json; then
            echo "Stable updater manifest is already newer or identical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "chore(updater): publish ${{ github.event.inputs.release_tag }}"
          git push
