name: Windows Codex launch test package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Pinned private llmpro source commit'
        required: true
        default: '12d9c17afb33a8a616fa9dde879289b1ba1eb3d2'

permissions:
  contents: read

jobs:
  windows-test-package:
    runs-on: windows-latest
    steps:
      - name: Checkout pinned private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Install JS dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate source and Windows launch tests
        working-directory: source
        run: |
          pnpm typecheck
          pnpm test --run
          cargo test --manifest-path src-tauri/Cargo.toml launcher::tests
        shell: pwsh

      - name: Build MSI and NSIS installers without publishing a release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: source
          args: '--bundles msi,nsis --config src-tauri/tauri.ci.conf.json'

      - name: Verify installers
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem source/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' -and $_.Name -like 'llmpro_0.2.113*' })
          if ($installers.Count -lt 2) { throw 'Expected both NSIS and MSI installers for version 0.2.113' }
          $installers | ForEach-Object { Write-Output "$($_.Name) $($_.Length) bytes SHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: llmpro-0.2.113-windows-codex-launch-test
          retention-days: 14
          if-no-files-found: error
          path: |
            source/src-tauri/target/release/bundle/nsis/*.exe
            source/src-tauri/target/release/bundle/msi/*.msi
