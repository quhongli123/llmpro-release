name: release

# 快速发布路径：复用私有源码仓已经成功构建的候选包，只做签名、公证、
# updater 清单和 OBS 发布。这样发布阶段不再重复编译整个 Tauri 应用。
#
# 时间目标：
# - 候选包已就绪时，准备 + macOS/Windows 并行封装在 5 分钟内完成；
# - GitHub/OBS 上传时间取决于实际带宽，单独统计；
# - 从源码冷编译请使用 release-full.yml。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的发布 tag，与 release_tag 一致'
        required: true
        type: string
      release_tag:
        description: '发布版本 tag，如 v0.2.0'
        required: true
        type: string
      platform:
        description: '正常发版选 all；仅在修复失败平台时选 macos 或 windows'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
      candidate_run_id:
        description: '可选：llmpro-build.yml 的成功 run id；留空自动查找'
        required: false
        type: string

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: llmpro-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare fast release
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      mac_artifact_id: ${{ steps.candidate.outputs.mac_artifact_id }}
      windows_artifact_id: ${{ steps.candidate.outputs.windows_artifact_id }}
      candidate_repository: ${{ steps.candidate.outputs.repository }}
      platform: ${{ steps.validate.outputs.platform }}

    steps:
      - name: Validate inputs
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::Expected a stable tag such as v0.2.161"
            exit 1
          fi
          if [[ "$SOURCE_REF" != "$RELEASE_TAG" ]]; then
            echo "::error title=Tag mismatch::source_ref and release_tag must be identical"
            exit 1
          fi
          case "$PLATFORM" in
            all|macos|windows) ;;
            *) echo "::error title=Invalid platform::$PLATFORM"; exit 1 ;;
          esac
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Resolve source commit
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/quhongli123/llmpro/git/ref/tags/$SOURCE_REF")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          sha="$(jq -r '.object.sha' <<<"$ref_json")"
          if [[ "$object_type" == "tag" ]]; then
            sha="$(gh api "repos/quhongli123/llmpro/git/tags/$sha" --jq '.object.sha')"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Source tag resolution failed::Unable to resolve $SOURCE_REF"
            exit 1
          fi
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Find candidate artifacts
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mac_name="llmpro-candidate-${SOURCE_SHA}-macos"
          windows_name="llmpro-candidate-${SOURCE_SHA}-windows"
          repository=""
          run_id=""

          if [[ -n "$CANDIDATE_RUN_ID" ]]; then
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
            run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            if [[ "$run_conclusion" != "success" ]]; then
              echo "::error title=Candidate run mismatch::Run $CANDIDATE_RUN_ID conclusion=$run_conclusion"
              exit 1
            fi
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")"
            repository="$GITHUB_REPOSITORY"
            run_id="$CANDIDATE_RUN_ID"
          else
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
            mac_artifact_id="$(jq -r --arg name "$mac_name" '
              .artifacts
              | map(select(.expired == false and .name == $name))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$artifacts_json")"
            windows_artifact_id="$(jq -r --arg name "$windows_name" '
              .artifacts
              | map(select(.expired == false and .name == $name))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$artifacts_json")"
            if [[ -n "$mac_artifact_id" && -n "$windows_artifact_id" ]]; then
              repository="$GITHUB_REPOSITORY"
              run_id="$(jq -r --arg name "$mac_name" '
                .artifacts[] | select(.name == $name) | .workflow_run.id // empty
              ' <<<"$artifacts_json" | head -1)"
            fi
          fi

          # 兼容以前由私有源码仓 llmpro-build.yml 生成的候选包。
          if [[ -z "$repository" ]]; then
            export GH_TOKEN="$SOURCE_REPO_TOKEN"
            if [[ -z "$CANDIDATE_RUN_ID" ]]; then
              CANDIDATE_RUN_ID="$(gh api                 "repos/quhongli123/llmpro/actions/workflows/llmpro-build.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=20"                 --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')"
            fi
            if [[ -n "$CANDIDATE_RUN_ID" ]]; then
              run_json="$(gh api "repos/quhongli123/llmpro/actions/runs/$CANDIDATE_RUN_ID")"
              run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              run_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
              if [[ "$run_conclusion" == "success" && "$run_sha" == "$SOURCE_SHA" ]]; then
                artifacts_json="$(gh api "repos/quhongli123/llmpro/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")"
                repository="quhongli123/llmpro"
                run_id="$CANDIDATE_RUN_ID"
              fi
            fi
          fi

          if [[ -z "$repository" ]]; then
            echo "::error title=Candidate build missing::No public prepare-release artifact or private llmpro-build.yml run exists for $SOURCE_SHA. Run prepare-release.yml first, provide candidate_run_id, or use release-full.yml."
            exit 1
          fi

          mac_artifact_id="$(jq -r --arg name "$mac_name" '
            .artifacts | map(select(.expired == false and .name == $name)) | .[0].id // empty
          ' <<<"$artifacts_json")"
          windows_artifact_id="$(jq -r --arg name "$windows_name" '
            .artifacts | map(select(.expired == false and .name == $name)) | .[0].id // empty
          ' <<<"$artifacts_json")"
          if [[ -z "$mac_artifact_id" || -z "$windows_artifact_id" ]]; then
            # 私有源码仓使用旧 artifact 名称。
            mac_artifact_id="$(jq -r '.artifacts[] | select(.expired == false and .name == "llmpro-macOS-aarch64-apple-darwin") | .id' <<<"$artifacts_json" | head -1)"
            windows_artifact_id="$(jq -r '.artifacts[] | select(.expired == false and .name == "llmpro-Windows-x86_64-pc-windows-msvc") | .id' <<<"$artifacts_json" | head -1)"
          fi
          if [[ -z "$mac_artifact_id" || -z "$windows_artifact_id" ]]; then
            echo "::error title=Candidate artifacts missing::Repository $repository must contain both macOS and Windows candidates for $SOURCE_SHA"
            exit 1
          fi

          {
            echo "repository=$repository"
            echo "run_id=$run_id"
            echo "mac_artifact_id=$mac_artifact_id"
            echo "windows_artifact_id=$windows_artifact_id"
          } >> "$GITHUB_OUTPUT"
          {
            echo "candidate_repository=$repository"
            echo "candidate_run=$run_id"
            echo "mac_artifact=$mac_artifact_id"
            echo "windows_artifact=$windows_artifact_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify OBS stable version
        env:
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          stable_url="${OBS_PUBLIC_BASE_URL%/}/llmpro/latest.json"
          curl -fsSL --retry 3 --max-time 30 "$stable_url" -o "$RUNNER_TEMP/current-llmpro.json"
          export LLMPRO_CURRENT_MANIFEST="$RUNNER_TEMP/current-llmpro.json"
          node <<'NODE'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync(process.env.LLMPRO_CURRENT_MANIFEST, 'utf8')).version;
          const requested = process.env.RELEASE_TAG.slice(1);
          if (!/^\d+\.\d+\.\d+$/.test(current)) throw new Error('Invalid OBS stable version');
          const compare = requested.split('.').map((part, index) => Number(part) - Number(current.split('.')[index])).find(Boolean);
          if (!(compare > 0)) throw new Error(`OBS already serves ${current}. Use a higher version.`);
          NODE

      - name: Read release notes
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/quhongli123/llmpro/contents/docs/releases/$RELEASE_TAG.md?ref=$RELEASE_TAG" \
            > "$notes"
          test -s "$notes"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error title=Release already published::Edit the existing release manually or use a higher version"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "llmpro $RELEASE_TAG" \
              --notes-file "$notes" \
              --draft
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "llmpro $RELEASE_TAG" \
              --notes-file "$notes" \
              --draft
          fi

  package-macos:
    name: Sign and notarize macOS
    needs: prepare
    if: needs.prepare.outputs.platform == 'all' || needs.prepare.outputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download prebuilt macOS candidate
        env:
          GH_TOKEN: ${{ needs.prepare.outputs.candidate_repository == github.repository && github.token || secrets.SOURCE_REPO_TOKEN }}
          CANDIDATE_REPOSITORY: ${{ needs.prepare.outputs.candidate_repository }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.mac_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/macos-candidate"
          gh api "repos/$CANDIDATE_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/macos-candidate.zip"
          unzip -q "$RUNNER_TEMP/macos-candidate.zip" -d "$RUNNER_TEMP/macos-candidate"

      - name: Sign, notarize, staple, and package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          work="$RUNNER_TEMP/llmpro-macos-release"
          mount="$RUNNER_TEMP/llmpro-candidate-mount"
          mkdir -p "$work" "$mount"

          dmg_in="$(find "$RUNNER_TEMP/macos-candidate" -type f -name "llmpro_${version}_aarch64.dmg" -print -quit)"
          test -n "$dmg_in"

          attach_dir="$(mktemp -d "$RUNNER_TEMP/attach.XXXXXX")"
          hdiutil attach "$dmg_in" -readonly -nobrowse -mountpoint "$attach_dir" >/dev/null
          trap 'hdiutil detach "$attach_dir" -quiet >/dev/null 2>&1 || true' EXIT
          ditto "$attach_dir/llmpro.app" "$work/llmpro.app"
          hdiutil detach "$attach_dir" -quiet
          trap - EXIT

          app="$work/llmpro.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "cn.modelbest.llmpro"

          keychain_password="$(openssl rand -hex 24)"
          keychain="$RUNNER_TEMP/llmpro-signing.keychain-db"
          cert="$RUNNER_TEMP/llmpro-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$APPLE_SIGNING_IDENTITY"

          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          notarize() {
            local file="$1"
            local result status
            result="$(xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --output-format json)"
            status="$(jq -r '.status // empty' <<<"$result")"
            if [[ "$status" != "Accepted" ]]; then
              echo "$result"
              exit 1
            fi
          }

          app_zip="$work/llmpro.app.zip"
          ditto -c -k --keepParent "$app" "$app_zip"
          notarize "$app_zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          stage="$work/dmg-stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/llmpro.app"
          ln -s /Applications "$stage/Applications"
          dmg_out="$work/llmpro_${version}_aarch64.dmg"
          hdiutil create -volname llmpro -srcfolder "$stage" -ov -format UDZO "$dmg_out" >/dev/null
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg_out"
          notarize "$dmg_out"
          xcrun stapler staple "$dmg_out"
          xcrun stapler validate "$dmg_out"
          codesign --verify --verbose=2 "$dmg_out"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_out"
          hdiutil verify "$dmg_out"

          updater="$work/llmpro_aarch64.app.tar.gz"
          tar -czf "$updater" -C "$work" llmpro.app
          npm exec --yes --package=@tauri-apps/cli@2.12.4 -- \
            tauri signer sign "$updater" --app-version "$version"
          test -s "$updater.sig"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$dmg_out" "$updater" "$updater.sig" \
            --clobber

  package-windows:
    name: Sign Windows updater artifacts
    needs: prepare
    if: needs.prepare.outputs.platform == 'all' || needs.prepare.outputs.platform == 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download prebuilt Windows candidate
        env:
          GH_TOKEN: ${{ needs.prepare.outputs.candidate_repository == github.repository && github.token || secrets.SOURCE_REPO_TOKEN }}
          CANDIDATE_REPOSITORY: ${{ needs.prepare.outputs.candidate_repository }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.windows_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-candidate"
          gh api "repos/$CANDIDATE_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/windows-candidate.zip"
          unzip -q "$RUNNER_TEMP/windows-candidate.zip" -d "$RUNNER_TEMP/windows-candidate"

      - name: Sign installers and upload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          nsis="$(find "$RUNNER_TEMP/windows-candidate" -type f -name "llmpro_${version}_x64-setup.exe" -print -quit)"
          msi="$(find "$RUNNER_TEMP/windows-candidate" -type f -name "llmpro_${version}_x64_en-US.msi" -print -quit)"
          test -s "$nsis"
          test -s "$msi"

          npm exec --yes --package=@tauri-apps/cli@2.12.4 -- \
            tauri signer sign "$nsis" --app-version "$version"
          npm exec --yes --package=@tauri-apps/cli@2.12.4 -- \
            tauri signer sign "$msi" --app-version "$version"
          test -s "$nsis.sig"
          test -s "$msi.sig"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$nsis" "$nsis.sig" "$msi" "$msi.sig" \
            --clobber

  publish-obs:
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.package-macos.result == 'success' || needs.package-macos.result == 'skipped') &&
      (needs.package-windows.result == 'success' || needs.package-windows.result == 'skipped')
    name: Publish OBS artifacts and bridge manifest
    needs:
      - prepare
      - package-macos
      - package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download all generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --dir .release-assets

      - name: Create updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET_DIR: .release-assets
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > "$RELEASE_NOTES_FILE"
          node scripts/create-latest-json.mjs

      - name: Prepare OBS manifest and upload directory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET_DIR: .release-assets
          OBS_UPLOAD_DIR: .obs-upload
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          STABLE_MANIFEST_PATH: updater/latest.json
        run: node scripts/publish-obs-manifest.mjs

      - name: Verify updater signatures with the installed clients' public key
        env:
          LLMPRO_MINISIGN_PUBKEY: RWSipQpmnZGmex/yNP6DOUrAa5D212WxeER0LcSr3d7LqDUGdnAkRe+C
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          jq -e -r '.platforms[].url | split("/") | last' .obs-upload/latest.json \
            | sort -u > "$RUNNER_TEMP/llmpro-updater-assets"
          while IFS= read -r name; do
            base64 --decode ".obs-upload/$name.sig" > "$RUNNER_TEMP/llmpro-updater.sig"
            minisign -Vm ".obs-upload/$name" -x "$RUNNER_TEMP/llmpro-updater.sig" \
              -P "$LLMPRO_MINISIGN_PUBKEY"
          done < "$RUNNER_TEMP/llmpro-updater-assets"

      - name: Install obsutil
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obsutil"
          curl -fsSL \
            'https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz' \
            | tar -xz -C "$RUNNER_TEMP/obsutil"
          OBSUTIL="$(find "$RUNNER_TEMP/obsutil" -type f -name obsutil | head -1)"
          test -n "$OBSUTIL"
          chmod 755 "$OBSUTIL"
          echo "OBSUTIL=$OBSUTIL" >> "$GITHUB_ENV"

      - name: Upload and verify versioned OBS assets
        env:
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          config_dir="$RUNNER_TEMP/obs-config"
          mkdir -p "$config_dir"
          cd "$config_dir"
          "$OBSUTIL" config \
            -i="$OBS_ACCESS_KEY" \
            -k="$OBS_SECRET_KEY" \
            -e="$OBS_ENDPOINT"

          upload_pids=()
          upload_names=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            (
              "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/$name" \
                "obs://$OBS_BUCKET/llmpro/$version/$name" \
                -f \
                -acl=public-read \
                -threshold=1 \
                -ps=5MB \
                -p=4
            ) &
            upload_pids+=("$!")
            upload_names+=("$name")
          done < <(find "$GITHUB_WORKSPACE/.obs-upload" -maxdepth 1 -type f -print0)

          upload_failed=0
          for index in "${!upload_pids[@]}"; do
            if ! wait "${upload_pids[$index]}"; then
              echo "::error title=OBS upload failed::${upload_names[$index]}"
              upload_failed=1
            fi
          done
          test "$upload_failed" -eq 0

          public_dir="${OBS_PUBLIC_BASE_URL%/}/llmpro/$version"
          for name in "${upload_names[@]}"; do
            file="$GITHUB_WORKSPACE/.obs-upload/$name"
            expected="$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(curl -fsSL --retry 3 --max-time 120 "$public_dir/$name" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$expected"
          done

          "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/latest.json" \
            "obs://$OBS_BUCKET/llmpro/latest.json" \
            -f \
            -acl=public-read \
            -meta=Content-Type:application/json

      - name: Replace GitHub bridge manifest with OBS URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            .obs-upload/latest.json \
            --clobber

      - name: Commit bridge manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- updater/latest.json; then
            echo "Bridge manifest is already newer or identical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "chore(updater): bridge $RELEASE_TAG to OBS"
          git push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
