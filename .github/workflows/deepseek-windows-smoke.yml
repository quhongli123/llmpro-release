name: DeepSeek Windows test package

on:
  push:
    branches:
      - quhongli/deepseek-windows-node24

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: quhongli/deepseek-runtime-integrity-v2
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup managed Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run Windows DeepSeek Web smoke
        working-directory: source
        shell: pwsh
        env:
          LLMPRO_DEEPSEEK_RUST_SMOKE: '1'
        run: pnpm test:deepseek-smoke

      - name: Run source validation
        working-directory: source
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows test installers
        working-directory: source
        shell: pwsh
        run: pnpm exec tauri build --bundles msi,nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows test installers
        uses: actions/upload-artifact@v4
        with:
          name: llmpro-0.2.87-windows-test
          if-no-files-found: error
          retention-days: 14
          path: |
            source/src-tauri/target/release/bundle/**/*.msi
            source/src-tauri/target/release/bundle/**/*.exe
