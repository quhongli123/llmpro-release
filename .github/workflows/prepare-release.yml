name: prepare-release
run-name: prepare-release ${{ inputs.source_ref }} (${{ inputs.macos_runner }})

# 在公开仓预先编译未签名候选包，避免私有源码仓 Actions 配额影响发版。
# 正常流程只需运行本 workflow；成功后 release.yml 会通过 workflow_run 自动接力。
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的发布 tag，例如 v0.2.164'
        required: true
        type: string
      macos_runner:
        description: 'macOS runner；默认原生 Apple Silicon，队列异常时可选 Intel 兜底'
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-15-intel
      publish_after_build:
        description: '构建成功后自动签名发布；仅测试候选包时取消'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: llmpro-prepare-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight release
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify tagged release
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.source_ref }}
        run: node scripts/verify-release-version.mjs

      - name: Verify release settings before expensive builds
        env:
          RELEASE_TAG: ${{ inputs.source_ref }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::Expected a stable tag such as v0.2.164"
            exit 1
          fi

          missing=0
          for name in \
            SOURCE_REPO_TOKEN \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            OBS_ACCESS_KEY \
            OBS_SECRET_KEY \
            OBS_BUCKET \
            OBS_ENDPOINT \
            OBS_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing release setting::$name is required"
              missing=1
            fi
          done
          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}${APPLE_PASSWORD:-}" ]; then
            echo "::error title=Missing release setting::APPLE_APP_SPECIFIC_PASSWORD or APPLE_PASSWORD is required"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          test -s "source/docs/releases/$RELEASE_TAG.md"

          stable_url="${OBS_PUBLIC_BASE_URL%/}/llmpro/latest.json"
          curl -fsSL --retry 3 --max-time 30 "$stable_url" -o "$RUNNER_TEMP/current-llmpro.json"
          export LLMPRO_CURRENT_MANIFEST="$RUNNER_TEMP/current-llmpro.json"
          node <<'NODE'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync(process.env.LLMPRO_CURRENT_MANIFEST, 'utf8')).version;
          const requested = process.env.RELEASE_TAG.slice(1);
          const parse = (value) => value.split('.').map(Number);
          const currentParts = parse(current);
          const requestedParts = parse(requested);
          const comparison = requestedParts
            .map((part, index) => part - currentParts[index])
            .find(Boolean) ?? 0;
          if (!/^\d+\.\d+\.\d+$/.test(current) || comparison <= 0) {
            throw new Error(`OBS must be below ${requested}; it currently serves ${current}.`);
          }
          NODE

          {
            echo "### Release preflight passed"
            echo "- source: \`$RELEASE_TAG\`"
            echo "- source SHA: \`${{ steps.source.outputs.sha }}\`"
            echo "- macOS runner: \`${{ inputs.macos_runner }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }} candidate
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: ${{ inputs.macos_runner }}
            target: aarch64-apple-darwin
            bundles: dmg
          - name: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: ${{ needs.preflight.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust toolchain from source
        working-directory: source
        run: rustup show

      - name: Install macOS cross target
        if: matrix.name == 'macos'
        working-directory: source
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'
          shared-key: llmpro-candidate-${{ matrix.name }}
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build unsigned candidate
        working-directory: source
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/llmpro-build.json"
          pnpm tauri build \
            --config "$RUNNER_TEMP/llmpro-build.json" \
            --target "$TARGET" \
            --bundles "$BUNDLES" \
            --no-sign \
            --ci \
            -- --locked

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmpro-candidate-${{ steps.source.outputs.sha }}-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            source/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            source/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            source/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  release-meta:
    name: Publish release metadata
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Create release metadata
        env:
          RELEASE_TAG: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          AUTO_PUBLISH: ${{ inputs.publish_after_build }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("release-meta.json", JSON.stringify({
              source_ref: process.env.RELEASE_TAG,
              release_tag: process.env.RELEASE_TAG,
              source_sha: process.env.SOURCE_SHA,
              auto_publish: process.env.AUTO_PUBLISH === "true"
            }, null, 2));
          '
          cat release-meta.json

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: llmpro-release-meta-${{ needs.preflight.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 3
          path: release-meta.json
