name: release-full

# 这个 workflow 属于【公开发布仓 llmpro-release】。
# 它在构建时临时拉取【私有源码仓 llmpro】的代码（源码不会进入本仓库），
# 编译签名 macOS 和 Windows 安装包，上传到 Huawei Cloud OBS，并同步一个 GitHub
# bridge latest.json，兼容已经安装的旧版本。
#
# 慢速兜底：从源码完整编译。正常发版请使用 release.yml（预构建候选包路径）。
# 手动发版：Actions -> release-full -> Run workflow，填写：
#   source_ref  = 私有源码仓的发布 tag，与 release_tag 一致
#   release_tag = 发布版本号，如 v0.2.0（需与源码里 tauri.conf.json 的 version 一致）
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有源码仓的发布 tag，与 release_tag 一致'
        required: true
      release_tag:
        description: '发布版本 tag，如 v0.2.0'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: llmpro-release-publication
  cancel-in-progress: false

jobs:
  resolve-platforms:
    name: Resolve build platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { RELEASE_TAG: tag, SOURCE_REF: ref } = process.env;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag !== ref) {
            throw new Error('source_ref must be the same stable version tag as release_tag');
          }
          const include = [
            { name: 'macos', platform: 'macos-15', args: '--target aarch64-apple-darwin --bundles app,dmg' },
            { name: 'windows', platform: 'windows-2022', args: '--target x86_64-pc-windows-msvc --bundles nsis,msi' },
          ];
          process.stdout.write(`matrix=${JSON.stringify({ include })}\n`);
          NODE

  verify-obs-config:
    name: Verify OBS release configuration
    needs: resolve-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Check OBS variables and secrets
        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            OBS_ACCESS_KEY \
            OBS_SECRET_KEY \
            OBS_BUCKET \
            OBS_ENDPOINT \
            OBS_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing OBS release setting::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          stable_url="${OBS_PUBLIC_BASE_URL%/}/llmpro/latest.json"
          curl -fsSL --retry 3 --max-time 30 "$stable_url" -o "$RUNNER_TEMP/current-llmpro.json"
          export LLMPRO_CURRENT_MANIFEST="$RUNNER_TEMP/current-llmpro.json"
          node <<'NODE'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync(process.env.LLMPRO_CURRENT_MANIFEST, 'utf8')).version;
          const requested = process.env.RELEASE_TAG.slice(1);
          if (!/^\d+\.\d+\.\d+$/.test(current)) throw new Error('Invalid OBS stable version');
          const compare = requested.split('.').map((part, index) => Number(part) - Number(current.split('.')[index])).find(Boolean);
          if (!(compare > 0)) throw new Error(`OBS already serves ${current}. Use a higher version.`);
          NODE


  validate:
    name: Validate source (${{ matrix.platform }})
    needs: resolve-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: refs/tags/${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust toolchain from source
        working-directory: source
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Verify version and installer identity
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-version.mjs

      - name: Install JS deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate source
        working-directory: source
        run: |
          pnpm typecheck
          # Longer DOM interaction tests can exceed Vitest's default on Windows runners.
          pnpm test:unit ${{ runner.os == 'Windows' && '--testTimeout=10000' || '' }}
          pnpm build:renderer
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml llmcenter:: -- --test-threads=1

  release:
    needs:
      - verify-obs-config
      - resolve-platforms
      - validate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}

    steps:
      # SOURCE_REPO_TOKEN 由公开发布仓提供，只读访问私有源码。
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: quhongli123/llmpro
          ref: refs/tags/${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Read release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          notes="source/docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          end_marker="$(openssl rand -hex 16)"
          {
            echo "notes<<$end_marker"
            cat "$notes"
            echo
            echo "$end_marker"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Setup Rust toolchain from source
        working-directory: source
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './source/src-tauri -> target'

      - name: Verify version and installer identity
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-version.mjs

      - name: Install JS deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verify macOS signing and notarization secrets
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing macOS distribution secret::$name is required for signed and notarized distribution"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Store Apple notary credentials
        if: matrix.name == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials llmpro-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "APPLE_NOTARY_PROFILE=llmpro-notary" >> "$GITHUB_ENV"

      # tauri-action 在“本仓库”(公开仓)创建 Release，latest.json 里的下载地址即公开仓地址
      - name: Build and upload signed release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLMPRO_FEEDBACK_BITABLE_URL: ${{ vars.LLMPRO_FEEDBACK_BITABLE_URL }}
          LLMPRO_FEEDBACK_RELAY_URL: ${{ vars.LLMPRO_FEEDBACK_RELAY_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Notarize the app before Tauri creates the DMG and updater archive.
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.name == 'macos' && (secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD) || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: source
          tagName: ${{ inputs.release_tag }}
          releaseName: 'llmpro ${{ inputs.release_tag }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} -- --locked

      - name: Notarize and staple macOS app and DMG
        if: matrix.name == 'macos'
        env:
          APPLE_NOTARY_PROFILE: ${{ env.APPLE_NOTARY_PROFILE }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app="$(find source/src-tauri/target -type d -path '*/release/bundle/macos/llmpro.app' -print -quit)"
          dmg="$(find source/src-tauri/target -type f -name "llmpro_${version}_aarch64.dmg" -print -quit)"
          test -n "$app" && test -n "$dmg"

          app_zip="${RUNNER_TEMP}/llmpro.app.zip"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" --keychain-profile "$APPLE_NOTARY_PROFILE" --wait
          xcrun stapler staple "$app"

          xcrun notarytool submit "$dmg" --keychain-profile "$APPLE_NOTARY_PROFILE" --wait
          xcrun stapler staple "$dmg"

      - name: Verify macOS Gatekeeper and notarization
        if: matrix.name == 'macos'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app="$(find source/src-tauri/target -type d -path '*/release/bundle/macos/llmpro.app' -print -quit)"
          dmg="$(find source/src-tauri/target -type f -name "llmpro_${version}_aarch64.dmg" -print -quit)"
          test -n "$app" && test -n "$dmg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "cn.modelbest.llmpro"
          test "$("$app/Contents/MacOS/llmpro" --version)" = "llmpro $version"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"

          updater="${app}.tar.gz"
          test -f "$updater"
          extracted="$(mktemp -d)"
          tar -xzf "$updater" -C "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/llmpro.app"
          spctl --assess --type execute --verbose=2 "$extracted/llmpro.app"
          xcrun stapler validate "$extracted/llmpro.app"

          mount="$(mktemp -d)"
          trap 'hdiutil detach "$mount" -quiet >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          codesign --verify --deep --strict --verbose=2 "$mount/llmpro.app"
          spctl --assess --type execute --verbose=2 "$mount/llmpro.app"
          xcrun stapler validate "$mount/llmpro.app"
          hdiutil detach "$mount" -quiet
          trap - EXIT

      - name: Verify Windows installers
        if: matrix.name == 'windows'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $build = 'source/src-tauri/target/x86_64-pc-windows-msvc/release'
          $exe = Get-Item -LiteralPath "$build/llmpro.exe" -ErrorAction Stop
          $info = $exe.VersionInfo
          if ("$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart)" -ne $version) {
            throw "Windows binary version does not match the release tag"
          }
          foreach ($asset in @("nsis/llmpro_${version}_x64-setup.exe", "msi/llmpro_${version}_x64_en-US.msi")) {
            if ((Get-Item -LiteralPath "$build/bundle/$asset" -ErrorAction Stop).Length -eq 0) {
              throw "Empty Windows installer: $asset"
            }
          }

      - name: Replace GitHub Release DMG with stapled artifact
        if: matrix.name == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="$(find source/src-tauri/target -type f -name "llmpro_${version}_aarch64.dmg" -print -quit)"
          test -n "$dmg"
          xcrun stapler validate "$dmg"
          gh release upload "$RELEASE_TAG" "$dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-obs:
    if: github.repository == 'quhongli123/llmpro-release' && github.ref == 'refs/heads/main'
    name: Publish OBS artifacts and bridge manifest
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download all generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --dir .release-assets

      - name: Prepare OBS manifest and upload directory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET_DIR: .release-assets
          OBS_UPLOAD_DIR: .obs-upload
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          STABLE_MANIFEST_PATH: updater/latest.json
        run: node scripts/publish-obs-manifest.mjs

      - name: Verify updater signatures with the installed clients' public key
        env:
          LLMPRO_MINISIGN_PUBKEY: RWSipQpmnZGmex/yNP6DOUrAa5D212WxeER0LcSr3d7LqDUGdnAkRe+C
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          jq -e -r '.platforms[].url | split("/") | last' .obs-upload/latest.json \
            | sort -u > "$RUNNER_TEMP/llmpro-updater-assets"
          while IFS= read -r name; do
            base64 --decode ".obs-upload/$name.sig" > "$RUNNER_TEMP/llmpro-updater.sig"
            minisign -Vm ".obs-upload/$name" -x "$RUNNER_TEMP/llmpro-updater.sig" \
              -P "$LLMPRO_MINISIGN_PUBKEY"
          done < "$RUNNER_TEMP/llmpro-updater-assets"

      - name: Install obsutil
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obsutil"
          curl -fsSL \
            'https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz' \
            | tar -xz -C "$RUNNER_TEMP/obsutil"
          OBSUTIL="$(find "$RUNNER_TEMP/obsutil" -type f -name obsutil | head -1)"
          if [ -z "$OBSUTIL" ]; then
            echo "::error::obsutil binary was not found"
            exit 1
          fi
          chmod 755 "$OBSUTIL"
          echo "OBSUTIL=$OBSUTIL" >> "$GITHUB_ENV"

      - name: Upload and verify versioned OBS assets
        env:
          OBS_PUBLIC_BASE_URL: ${{ vars.OBS_PUBLIC_BASE_URL }}
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_KEY }}
          OBS_ENDPOINT: ${{ vars.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ vars.OBS_BUCKET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          config_dir="$RUNNER_TEMP/obs-config"
          mkdir -p "$config_dir"
          cd "$config_dir"
          "$OBSUTIL" config \
            -i="$OBS_ACCESS_KEY" \
            -k="$OBS_SECRET_KEY" \
            -e="$OBS_ENDPOINT"

          upload_pids=()
          upload_names=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            (
              "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/$name" \
                "obs://$OBS_BUCKET/llmpro/$version/$name" \
                -f \
                -acl=public-read \
                -threshold=1 \
                -ps=5MB \
                -p=4
            ) &
            upload_pids+=("$!")
            upload_names+=("$name")
          done < <(find "$GITHUB_WORKSPACE/.obs-upload" -maxdepth 1 -type f -print0)

          upload_failed=0
          for index in "${!upload_pids[@]}"; do
            if ! wait "${upload_pids[$index]}"; then
              echo "::error title=OBS upload failed::${upload_names[$index]}"
              upload_failed=1
            fi
          done
          if [ "$upload_failed" -ne 0 ]; then
            exit 1
          fi

          public_dir="${OBS_PUBLIC_BASE_URL%/}/llmpro/$version"
          for name in "${upload_names[@]}"; do
            file="$GITHUB_WORKSPACE/.obs-upload/$name"
            expected="$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(curl -fsSL --retry 3 --max-time 120 "$public_dir/$name" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=OBS asset checksum mismatch::$name"
              exit 1
            fi
          done

          "$OBSUTIL" cp "$GITHUB_WORKSPACE/.obs-upload/latest.json" \
            "obs://$OBS_BUCKET/llmpro/latest.json" \
            -f \
            -acl=public-read \
            -meta=Content-Type:application/json

      - name: Replace GitHub bridge manifest with OBS URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            .obs-upload/latest.json \
            --clobber

      - name: Commit bridge manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- updater/latest.json; then
            echo "Bridge manifest is already newer or identical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git commit -m "chore(updater): bridge $RELEASE_TAG to OBS"
          git push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
